# Screenshot manifest for the ADL ADCON FTP Somalia Plugin guide (docs/guide.md).
# Regenerate from the adl repo:  scripts/capture-plugin-docs.sh ../adl-plugins/adl-ftp-adcon-som-plugin
# Fixture: docs/screenshots/fixture.json — an ADL FTP Plugin connection (id 1) using this
# plugin's decoder, pointed at the harness's mock FTP source, which serves sample files in
# this plugin's format from docs/screenshots/mock-ftp/generate.py. Station link 1 = DEMO001.
# Format: defaults + screenshots (name/url/setup/callouts/capture), run by adl's
# docs/screenshots/capture/capture.py; output derives from name: docs/images/<name>.png.
# Callouts are numbered badges/outlines only — never text in images.

defaults:
  viewport:
  - 1440
  - 900
  padding: 12
screenshots:
- name: adcon_som_connection_form
  url: /networkftp/edit/1/
  setup:
  - fill: { selector: '#id_password', value: '••••••••••••' }
  callouts:
  - highlight: '#id_decoder'
  capture:
    selector: "#w-editor-form"
- name: adcon_som_variable_mappings
  url: /networkftp/edit/1/
  capture:
    selector: '#id_variable_mappings-FORMS'
- name: adcon_som_station_link_form
  url: /ftpstationlink/edit/1/
  callouts:
  - badge:
      target: '#panel-child-remote_configuration-child-ftp_path-wrapper'
      n: 1
  - badge:
      target: '#id_file_pattern'
      n: 2
  - badge:
      target: '#id_dir_structured_by_date'
      n: 3
  - badge:
      target: '#id_listing_strategy'
      n: 4
  - badge:
      target: '#id_start_date'
      n: 5
  - badge:
      target: '#id_skip_already_downloaded_files'
      n: 6
  capture:
    selector: "#w-editor-form"
- name: adcon_som_ingestion_diagnostic
  url: /monitoring/connection/1/health/
  callouts:
  - highlight: .health-probe-form button
  capture:
    selector: .health-diagnostic
- name: adcon_som_station_source_check
  url: /ftpstationlink/inspect/1/
  capture:
    selector: ":nth-match(.collection-status, 2)"
- name: adcon_som_data_files
  url: /snippets/adl_ftp_plugin/ftpstationdatafile/
  capture:
    selector: main
